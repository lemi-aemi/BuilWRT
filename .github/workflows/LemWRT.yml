name: Build LemWRT x86_64 Final Ultra-Pro

on:
  workflow_dispatch:
    inputs:
      set_hostname:
        description: 'Masukkan Nama Router (Hostname)'
        required: true
        default: 'LemWRT'
      set_lan_ip:
        description: 'Masukkan IP LAN'
        required: true
        default: '10.10.88.1'
      set_ssid:
        description: 'Masukkan Nama WiFi (SSID)'
        required: true
        default: 'LemWRT_PRO'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules
          sudo apt-get clean
          df -h

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev libncurses-dev zstd p7zip-full binutils

      - name: Clone OpenWrt & Auto-Detect Latest Kernel Snapshot
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          # CUSTOM BRANDING & LOGIN TEXT
          sed -i 's/OpenWrt/LemWRT/g' include/target.mk
          sed -i 's/OpenWrt/LemWRT/g' package/base-files/files/usr/lib/os-release
          sed -i 's/OpenWrt/LemWRT/g' package/base-files/files/etc/banner

          # AUTO-DETECT KERNEL TERBARU DARI SERVER OPENWRT
          LATEST_KMOD_VER=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/kmods/ | grep -oE 'kernel_6\.[0-9]+\.[0-9]+-[0-9]+-[a-f0-9]{32}' | head -n 1 | sed 's/kernel_//')
          
          if [ -n "$LATEST_KMOD_VER" ]; then
            echo "LemWRT Snapshots (Kernel $LATEST_KMOD_VER)" > package/base-files/files/etc/openwrt_version
            echo "Detected Latest Kernel Version: $LATEST_KMOD_VER"
          else
            echo "LemWRT Snapshots (Kernel 6.18.54-1-d0b7e90eb09c21d99e46e3a687a2a66d)" > package/base-files/files/etc/openwrt_version
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Custom Apps & Themes
        run: |
          cd openwrt/package
          # Integrasi Repository Eksternal IMEI Changer dari Lemi-Aemi
          rm -rf /tmp/lemi-imei-repo
          git clone --depth 1 https://github.com/lemi-aemi/build-apk.yml.git /tmp/lemi-imei-repo
          if [ -d "/tmp/lemi-imei-repo/luci-app-imei-changer" ]; then
            cp -a /tmp/lemi-imei-repo/luci-app-imei-changer .
          elif [ -d "/tmp/lemi-imei-repo/luci-app-imei" ]; then
            cp -a /tmp/lemi-imei-repo/luci-app-imei .
          else
            cp -a /tmp/lemi-imei-repo/package/* . 2>/dev/null || true
          fi
          rm -rf /tmp/lemi-imei-repo

          # ----------------------------------------------------
          # INJEKSI CUSTOM LUCI APP FOR QMANAGER (3 MODEMS SUPPORT)
          # ----------------------------------------------------
          mkdir -p luci-app-qmanager/luasrc/controller/
          mkdir -p luci-app-qmanager/luasrc/model/cbi/qmanager/
          mkdir -p luci-app-qmanager/luasrc/view/qmanager/
          mkdir -p luci-app-qmanager/root/etc/config/

          # 1. Config Default (3 Modems IP)
          cat << 'EOF' > luci-app-qmanager/root/etc/config/qmanager
config qmanager 'main'
	option modem1_name 'Modem 1 (Primary)'
	option modem1_ip '192.168.224.1'
	option modem1_port '80'
	option modem2_name 'Modem 2 (Secondary)'
	option modem2_ip '192.168.8.1'
	option modem2_port '80'
	option modem3_name 'Modem 3 (Backup)'
	option modem3_ip '192.168.9.1'
	option modem3_port '80'
EOF

          # 2. Controller LuCI
          cat << 'EOF' > luci-app-qmanager/luasrc/controller/qmanager.lua
module("luci.controller.qmanager", package.seeall)

function index()
    if not nixio.fs.access("/etc/config/qmanager") then
        return
    end

    entry({"admin", "modem", "qmanager"}, template("qmanager/iframe"), _("QManager Multi-Modem"), 1).dependent = true
    entry({"admin", "modem", "qmanager_settings"}, cbi("qmanager/settings"), _("QManager Config"), 2).dependent = true
end
EOF

          # 3. Model CBI (Halaman Setting 3 IP Modem)
          cat << 'EOF' > luci-app-qmanager/luasrc/model/cbi/qmanager/settings.lua
m = Map("qmanager", translate("QManager Multi-Modem Settings"), translate("Atur Label Nama dan IP Target untuk 3 Modem Quectel/QManager"))

s = m:section(NamedSection, "main", "qmanager", translate("Konfigurasi Modem"))

-- Modem 1
s:option(Value, "modem1_name", translate("Modem 1 Label")).default = "Modem 1 (Primary)"
s:option(Value, "modem1_ip", translate("Modem 1 IP Address")).datatype = "ip4addr"
s:option(Value, "modem1_port", translate("Modem 1 Port")).datatype = "port"

-- Modem 2
s:option(Value, "modem2_name", translate("Modem 2 Label")).default = "Modem 2 (Secondary)"
s:option(Value, "modem2_ip", translate("Modem 2 IP Address")).datatype = "ip4addr"
s:option(Value, "modem2_port", translate("Modem 2 Port")).datatype = "port"

-- Modem 3
s:option(Value, "modem3_name", translate("Modem 3 Label")).default = "Modem 3 (Backup)"
s:option(Value, "modem3_ip", translate("Modem 3 IP Address")).datatype = "ip4addr"
s:option(Value, "modem3_port", translate("Modem 3 Port")).datatype = "port"

return m
EOF

          # 4. View Template (Interactive Multi-Tab iFrame)
          cat << 'EOF' > luci-app-qmanager/luasrc/view/qmanager/iframe.htm
<%+header%>
<%
local uci = require "luci.model.uci".cursor()
local m1_name = uci:get("qmanager", "main", "modem1_name") or "Modem 1"
local m1_ip = uci:get("qmanager", "main", "modem1_ip") or "192.168.224.1"
local m1_port = uci:get("qmanager", "main", "modem1_port") or "80"
local m1_url = "http://" .. m1_ip .. ":" .. m1_port

local m2_name = uci:get("qmanager", "main", "modem2_name") or "Modem 2"
local m2_ip = uci:get("qmanager", "main", "modem2_ip") or "192.168.8.1"
local m2_port = uci:get("qmanager", "main", "modem2_port") or "80"
local m2_url = "http://" .. m2_ip .. ":" .. m2_port

local m3_name = uci:get("qmanager", "main", "modem3_name") or "Modem 3"
local m3_ip = uci:get("qmanager", "main", "modem3_ip") or "192.168.9.1"
local m3_port = uci:get("qmanager", "main", "modem3_port") or "80"
local m3_url = "http://" .. m3_ip .. ":" .. m3_port
%>

<div class="cbi-map">
    <h2 style="margin-bottom: 10px;"><%:QManager Multi-Modem Dashboard%></h2>
    
    <!-- Tab Switcher Bar -->
    <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap;">
        <button id="btn-m1" class="btn cbi-button cbi-button-apply" onclick="switchModem('<%=m1_url%>', 'btn-m1')"><%=m1_name%> (<%=m1_ip%>)</button>
        <button id="btn-m2" class="btn cbi-button cbi-button-neutral" onclick="switchModem('<%=m2_url%>', 'btn-m2')"><%=m2_name%> (<%=m2_ip%>)</button>
        <button id="btn-m3" class="btn cbi-button cbi-button-neutral" onclick="switchModem('<%=m3_url%>', 'btn-m3')"><%=m3_name%> (<%=m3_ip%>)</button>
        <a id="ext-link" class="btn cbi-button cbi-button-action" href="<%=m1_url%>" target="_blank" style="margin-left: auto;"><%:Buka Tab Baru%></a>
    </div>

    <!-- Frame Display -->
    <div style="width: 100%; height: 85vh; border: 1px solid #333; border-radius: 8px; overflow: hidden; background: #111;">
        <iframe id="qmanager-frame" src="<%=m1_url%>" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

<script type="text/javascript">
function switchModem(url, btnId) {
    document.getElementById('qmanager-frame').src = url;
    document.getElementById('ext-link').href = url;
    
    ['btn-m1', 'btn-m2', 'btn-m3'].forEach(function(id) {
        var btn = document.getElementById(id);
        if (id === btnId) {
            btn.className = 'btn cbi-button cbi-button-apply';
        } else {
            btn.className = 'btn cbi-button cbi-button-neutral';
        }
    });
}
</script>

<%+footer%>
EOF

          # 5. Makefile Package
          cat << 'EOF' > luci-app-qmanager/Makefile
include $(TOPDIR)/rules.mk

LUCI_TITLE:=LuCI Support for Multi-Modem QManager Web Dashboard
LUCI_DEPENDS:=+luci-base
LUCI_PKGARCH:=all

PKG_NAME:=luci-app-qmanager
PKG_RELEASE:=1

include $(TOPDIR)/feeds/luci/luci.mk
EOF

          # Clone All-in-One NetSpeedTest & TinyFileManager dari Muink + Speedtest Onyx dari MrManiesh
          git clone --depth 1 https://github.com/muink/luci-app-netspeedtest.git
          git clone --depth 1 https://github.com/muink/luci-app-tinyfilemanager.git
          git clone --depth 1 https://github.com/MrManiesh/luci-app-speedtest-onyx.git

          # Clone Bandix Plus & LuCI Mobile API Support
          git clone --depth 1 https://github.com/timsaya/luci-app-bandix-plus.git
          git clone --depth 1 https://github.com/timsaya/openwrt-bandix-plus.git
          git clone --depth 1 https://github.com/cogwheel0/luci-mobile.git

          # Ekstrasi Monorepo Vantage (luci-theme-vantage & luci-app-vantage)
          rm -rf /tmp/vantage-repo
          git clone --depth 1 https://github.com/anothaDev/luci-theme-vantage.git /tmp/vantage-repo
          [ -d "/tmp/vantage-repo/luci-theme-vantage" ] && cp -a /tmp/vantage-repo/luci-theme-vantage .
          [ -d "/tmp/vantage-repo/luci-app-vantage" ] && cp -a /tmp/vantage-repo/luci-app-vantage .
          rm -rf /tmp/vantage-repo

          # Clone Ekosistem iStore & NAS Packages
          git clone --depth 1 https://github.com/linkease/istore.git
          git clone --depth 1 https://github.com/linkease/istore-ui.git
          git clone --depth 1 https://github.com/linkease/nas-packages.git
          git clone --depth 1 https://github.com/linkease/nas-packages-luci.git

          # Clone Themes Lainnya (Proton 2025, ARWI, Argon)
          git clone --depth 1 https://github.com/ChesterGoodiny/luci-theme-proton2025.git
          git clone --depth 1 https://github.com/derisamedia/luci-theme-arwi.git
          git clone --depth 1 https://github.com/derisamedia/luci-app-arwi-dashboard.git
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git

          # Clone 5G Modem Apps dari 4IceG & Repositori Lainnya
          git clone --depth 1 https://github.com/4IceG/luci-app-atinout.git
          git clone --depth 1 https://github.com/4IceG/luci-app-3ginfo-lite.git
          git clone --depth 1 https://github.com/4IceG/luci-app-internet-detector.git
          git clone --depth 1 https://github.com/4IceG/luci-app-mini-diskmanager.git
          git clone --depth 1 https://github.com/4IceG/luci-app-lite-watchdog.git

          git clone --depth 1 https://github.com/fildunsky/luci-app-5gmodem.git
          git clone --depth 1 https://github.com/souwei168/luci-app-store.git
          git clone --depth 1 https://github.com/esirplayground/luci-app-poweroff.git
          git clone --depth 1 https://github.com/obsy/apcontroller.git
          git clone --depth 1 https://github.com/immortalwrt-collections/openwrt-filebrowser.git
          git clone --depth 1 https://github.com/sirpdboy/luci-app-poweroffdevice.git

      - name: Inject Hybrid Pre-built Packages, Speedtest CLI, & Assets
        run: |
          cd openwrt
          mkdir -p files/tmp
          mkdir -p files/root
          mkdir -p files/usr/bin
          mkdir -p files/etc/opkg/keys/

          # 1. Download & Install Official Ookla Speedtest CLI Binary
          wget -O /tmp/ookla-speedtest.tgz https://install.speedtest.net/app/cli/ookla-speedtest-1.2.0-linux-x86_64.tgz
          tar -xzf /tmp/ookla-speedtest.tgz -C files/usr/bin/ speedtest
          chmod +x files/usr/bin/speedtest
          rm -f /tmp/ookla-speedtest.tgz

          # 2. Download & Extract Pre-built IPK iPerf3 Server dari Kiddin9
          mkdir -p /tmp/ipk_extract
          wget -O /tmp/ipk_extract/luci-app-iperf3-server.ipk "https://dl.openwrt.ai/packages-25.12/x86_64/kiddin9/luci-app-iperf3-server_3.0.0-r1_all.ipk"

          for ipk in /tmp/ipk_extract/*.ipk; do
            tar -xzf "$ipk" -C /tmp/ipk_extract/
            if [ -f /tmp/ipk_extract/data.tar.gz ]; then
              tar -xzf /tmp/ipk_extract/data.tar.gz -C files/
            elif [ -f /tmp/ipk_extract/data.tar.zst ]; then
              tar --zstd -xf /tmp/ipk_extract/data.tar.zst -C files/
            fi
            rm -rf /tmp/ipk_extract/control* /tmp/ipk_extract/data* /tmp/ipk_extract/debian-binary
          done
          rm -rf /tmp/ipk_extract

          # 3. Download APK modemband, modemdata, Arwi Theme, & Arwi Dashboard ke /files/root/
          wget -O files/root/modemdata-20260705-r1.apk https://github.com/4IceG/luci-app-modemdata/releases/download/1.0.32-r20260709/modemdata-20260705-r1.apk
          wget -O files/root/luci-app-modemdata-1.0.32-r20260709.apk https://github.com/4IceG/luci-app-modemdata/releases/download/1.0.32-r20260709/luci-app-modemdata-1.0.32-r20260709.apk
          wget -O files/root/modemband-20251215-r3.apk https://github.com/4IceG/luci-app-modemband/releases/download/1.0.31-r20260215/modemband-20251215-r3.apk
          wget -O files/root/luci-app-modemband-1.0.31-r20260215.apk https://github.com/4IceG/luci-app-modemband/releases/download/1.0.31-r20260215/luci-app-modemband-1.0.31-r20260215.apk
          wget -O files/root/luci-theme-Arwi-4.2.3_beta2-r1.apk https://github.com/derisamedia/luci-theme-arwi/releases/download/v4.2.3_beta2/luci-theme-Arwi-4.2.3_beta2-r1.apk
          wget -O files/root/luci-app-arwi-dashboard-1.2-r1.apk https://github.com/derisamedia/luci-app-arwi-dashboard/releases/download/1.2.0-APK/luci-app-arwi-dashboard-1.2-r1.apk

          # Download REPO KEY 4IceG
          sudo mkdir -p /etc/apk/repositories.d/ /etc/apk/keys/
          echo 'https://github.com/4IceG/Modem-extras-apk/raw/refs/heads/main/myapk/packages.adb' | sudo tee -a /etc/apk/repositories.d/customfeeds.list
          sudo wget https://github.com/4IceG/Modem-extras-apk/raw/refs/heads/main/myapk/IceG-apkpub.pem -O /etc/apk/keys/IceG-apkpub.pem

          # Download Firmware MediaTek & Qualcomm
          mkdir -p files/lib/firmware/mediatek/mt7927/
          wget -O files/lib/firmware/mediatek/mt7927/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7927/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin"
          wget -O files/lib/firmware/mediatek/mt7927/WIFI_RAM_CODE_MT6639_2_1.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7927/WIFI_RAM_CODE_MT6639_2_1.bin"

          mkdir -p files/lib/firmware/ath12k/WCN7850/hw2.0/
          wget -O files/lib/firmware/ath12k/WCN7850/hw2.0/amss.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath12k/WCN7850/hw2.0/amss.bin"
          wget -O files/lib/firmware/ath12k/WCN7850/hw2.0/board-2.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath12k/WCN7850/hw2.0/board-2.bin"
          wget -O files/lib/firmware/ath12k/WCN7850/hw2.0/m3.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath12k/WCN7850/hw2.0/m3.bin"
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a
		  
	  - name: Inject Custom DNA (Ultimate Branding, Auto-Install APK & Layout)
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat <<EOF > files/etc/uci-defaults/99-lemwrt-final
          #!/bin/sh
          # 1. Identitas
          uci set system.@system[0].hostname='${{ github.event.inputs.set_hostname }}'
          (echo 'mi1003'; echo 'mi1003') | passwd root

          # 2. Universal Bridge LAN & Global Network Settings
          uci delete network.lan
          uci set network.lan=interface
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='${{ github.event.inputs.set_lan_ip }}'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.device_lan=device
          uci set network.device_lan.name='br-lan'
          uci set network.device_lan.type='bridge'
          for i in \$(ls /sys/class/net | grep -E 'eth|enp|ena'); do
            uci add_list network.device_lan.ports="\$i"
          done

          # 2a. SET PACKET STEERING TO ENABLED (ALL CPUs) BY DEFAULT
          uci set network.globals.packet_steering='1' 2>/dev/null || true

          # 2b. USB Tethering
          uci set network.wan_usb=interface
          uci set network.wan_usb.proto='dhcp'
          uci set network.wan_usb.device='usb0'
          uci set network.wan_usb.metric='20'
          uci set network.device_usb=device
          uci set network.device_usb.name='usb0'
          uci commit network

          # 3. WiFi Setup
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio0.band='5g'
          uci set wireless.radio0.channel='149'
          uci set wireless.radio0.htmode='HE80'
          uci set wireless.radio0.country='US'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio0.ssid='${{ github.event.inputs.set_ssid }}'
          uci set wireless.default_radio0.key='mi123456'
          uci set wireless.default_radio0.encryption='sae-mixed'
          uci set wireless.default_radio0.network='lan'

          # 4. EXECUTING AUTOMATIC APK INSTALLATION
          if [ -d /root ] && [ -n "\$(ls /root/*.apk 2>/dev/null)" ]; then
            cd /root
            apk add --allow-untrusted *.apk 2>/dev/null || true
            rm -f /root/*.apk
          fi

          # 5. INJEKSI AUTOMATIS KE /etc/rc.local (CPU Performance & USB Autosuspend Fix)
          cat << 'RCLOCAL' > /etc/rc.local
          #!/bin/sh

          # Force Performance Mode
          for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
              echo "performance" > "\$g" 2>/dev/null
          done

          # Disable USB Autosuspend Globally & Specific Ports
          echo -1 > /sys/module/usbcore/parameters/autosuspend
          echo -1 > /sys/bus/usb/devices/2-1/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/9-1/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb1/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb10/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb2/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb3/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb4/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb5/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb6/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb7/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb8/power/autosuspend_delay_ms 2>/dev/null
          echo -1 > /sys/bus/usb/devices/usb9/power/autosuspend_delay_ms 2>/dev/null

          exit 0
          RCLOCAL
          chmod +x /etc/rc.local

          mkdir -p /etc/modprobe.d
          echo "options usbcore autosuspend=-1" > /etc/modprobe.d/disable-usb-autosuspend.conf

          # 6. AUTO-ENABLE & START BANDIX PLUS SERVICE
          uci set bandix_plus.main.enabled='1' 2>/dev/null || uci set bandix.main.enabled='1' 2>/dev/null || true
          uci commit bandix_plus 2>/dev/null || uci commit bandix 2>/dev/null || true
          /etc/init.d/bandix-plus enable 2>/dev/null || /etc/init.d/bandix enable 2>/dev/null || true
          /etc/init.d/bandix-plus start 2>/dev/null || /etc/init.d/bandix start 2>/dev/null || true

          # 7. PENDAFTARAN TEMA DAN DASHBOARD SECARA AUTO
          uci set luci.main.mediaurlbase='/luci-static/vantage' 2>/dev/null || uci set luci.main.mediaurlbase='/luci-static/argon'
          uci commit luci

          # Clear LuCI Cache & Rebuild Menu Index
          rm -f /tmp/luci-indexcache /tmp/luci-modulecache/*

          # Optimasi ModemManager
          uci set modemmanager.@modemmanager[0].loglevel='ERR'
          uci set modemmanager.@modemmanager[0].enable_at_locking='0'

          # 8. RE-GROUPING MENU & REGISTER DASHBOARD
          [ -f /usr/share/luci/menu.d/luci-app-statistics.json ] && sed -i 's/"admin\/statistics"/"admin\/statistics_root"/g' /usr/share/luci/menu.d/luci-app-statistics.json
          [ -f /usr/share/luci/menu.d/luci-app-nlbwmon.json ] && sed -i 's/"admin\/bandwidth"/"admin\/statistics_root"/g' /usr/share/luci/menu.d/luci-app-nlbwmon.json

          # DASHBOARDS Grouping
          [ -f /usr/share/luci/menu.d/luci-app-vantage.json ] && sed -i 's/"admin\/status"/"admin\/status\/vantage"/g' /usr/share/luci/menu.d/luci-app-vantage.json
          [ -f /usr/share/luci/menu.d/luci-app-arwi-dashboard.json ] && sed -i 's/"admin\/status"/"admin\/status\/arwi"/g' /usr/share/luci/menu.d/luci-app-arwi-dashboard.json
          [ -f /usr/share/luci/menu.d/luci-app-proton2025-dashboard.json ] && sed -i 's/"admin\/status"/"admin\/status\/proton"/g' /usr/share/luci/menu.d/luci-app-proton2025-dashboard.json

          # MODEM Group
          [ -f /usr/share/luci/menu.d/luci-app-mwan3.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-mwan3.json

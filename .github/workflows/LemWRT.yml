name: Build LemWRT x86_64 Final Hybrid Ultra-Pro

on:
  workflow_dispatch:
    inputs:
      set_hostname:
        description: 'Masukkan Nama Router (Hostname)'
        required: true
        default: 'LemWRT'
      set_lan_ip:
        description: 'Masukkan IP LAN'
        required: true
        default: '10.10.88.1'
      set_ssid:
        description: 'Masukkan Nama WiFi (SSID)'
        required: true
        default: 'LemWRT_PRO'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev libncurses-dev zstd

      - name: Clone OpenWrt Snapshots & Custom Branding
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt

          # CUSTOM BRANDING & LOGIN TEXT
          sed -i 's/OpenWrt/LemWRT/g' include/target.mk
          sed -i 's/OpenWrt/LemWRT/g' package/base-files/files/usr/lib/os-release
          sed -i 's/OpenWrt/LemWRT/g' package/base-files/files/etc/banner

          # LOCK TARGET KERNEL SNAPSHOT VERSION
          echo "LemWRT Snapshots (Kernel 6.18.52-1-0b5a9c322f5b9a40fe5a97451f6e9c58)" > package/base-files/files/etc/openwrt_version

      - name: Clone Source-based Packages (Kernel & Service Dependent)
        run: |
          cd openwrt/package

          # 1. IMEI Changer Suite (Lemi-Aemi)
          rm -rf /tmp/lemi-imei-repo
          git clone --depth 1 https://github.com/lemi-aemi/build-apk.yml.git /tmp/lemi-imei-repo
          if [ -d "/tmp/lemi-imei-repo/luci-app-imei-changer" ]; then
            cp -a /tmp/lemi-imei-repo/luci-app-imei-changer .
          elif [ -d "/tmp/lemi-imei-repo/luci-app-imei" ]; then
            cp -a /tmp/lemi-imei-repo/luci-app-imei .
          else
            cp -a /tmp/lemi-imei-repo/package/* . 2>/dev/null || true
          fi
          rm -rf /tmp/lemi-imei-repo

          # 2. Bandix Plus Traffic Monitoring
          git clone --depth 1 https://github.com/timsaya/luci-app-bandix-plus.git 2>/dev/null || true
          git clone --depth 1 https://github.com/timsaya/openwrt-bandix-plus.git 2>/dev/null || true

          # 3. iStore & Linkease Ecosystem (Termasuk QuickStart Kwrt UI)
          git clone --depth 1 https://github.com/linkease/istore.git 2>/dev/null || true
          git clone --depth 1 https://github.com/linkease/istore-ui.git 2>/dev/null || true
          git clone --depth 1 https://github.com/linkease/nas-packages.git 2>/dev/null || true
          git clone --depth 1 https://github.com/linkease/nas-packages-luci.git 2>/dev/null || true

          # 4. TinyFileManager & Docker Manager UI
          git clone --depth 1 https://github.com/muink/luci-app-tinyfilemanager.git 2>/dev/null || true
          git clone --depth 1 https://github.com/lisaac/luci-app-dockerman.git 2>/dev/null || true

          # 5. Themes & Custom Applications
          git clone --depth 1 https://github.com/kiddin9/luci-theme-kiddin9.git 2>/dev/null || true
          git clone --depth 1 https://github.com/fildunsky/luci-app-5gmodem.git 2>/dev/null || true
          git clone --depth 1 https://github.com/4IceG/luci-app-internet-detector.git 2>/dev/null || true
          git clone --depth 1 https://github.com/souwei168/luci-app-store.git 2>/dev/null || true
          git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git 2>/dev/null || true
          git clone --depth 1 https://github.com/jerrykuku/luci-app-argon-config.git 2>/dev/null || true
          git clone --depth 1 https://github.com/esirplayground/luci-app-poweroff.git 2>/dev/null || true
          git clone --depth 1 https://github.com/obsy/apcontroller.git 2>/dev/null || true
          git clone --depth 1 https://github.com/4IceG/luci-app-atinout.git 2>/dev/null || true
          git clone --depth 1 https://github.com/4IceG/luci-app-mini-diskmanager.git 2>/dev/null || true
          git clone --depth 1 https://github.com/4IceG/luci-app-sms-manager.git 2>/dev/null || true
          git clone --depth 1 https://github.com/4IceG/luci-app-lite-watchdog.git 2>/dev/null || true
          git clone --depth 1 https://github.com/4IceG/luci-app-3ginfo-lite.git 2>/dev/null || true
          git clone --depth 1 https://github.com/immortalwrt-collections/openwrt-filebrowser.git 2>/dev/null || true
          git clone --depth 1 https://github.com/sirpdboy/luci-app-poweroffdevice.git 2>/dev/null || true
          git clone --depth 1 --branch 1.2.0-APK https://github.com/derisamedia/luci-app-arwi-dashboard.git 2>/dev/null || true

      - name: Inject Hybrid Pre-built Packages, Repo Keys & Firmware Assets
        run: |
          cd openwrt
          # Buat folder penampung paket pre-built lokal di rootfs firmware
          mkdir -p files/ipk
          mkdir -p files/etc/opkg/keys/

          # Download REPO KEY 4IceG (IceG Public Key)
          wget -O files/etc/opkg/keys/IceG-repo.pub https://raw.githubusercontent.com/4IceG/Modem-extras/main/myrepo/IceG-repo.pub || true

          # Download Pre-built APK Tema Arwi
          wget -O files/ipk/luci-theme-Arwi-4.2.3_beta2-r1.apk https://github.com/derisamedia/luci-theme-arwi/releases/download/v4.2.3_beta2/luci-theme-Arwi-4.2.3_beta2-r1.apk || true

          # Download Firmware Binary Wi-Fi MediaTek MT7927 / MT6639
          mkdir -p files/lib/firmware/mediatek/mt7927/
          wget -O files/lib/firmware/mediatek/mt7927/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7927/WIFI_MT6639_PATCH_MCU_2_1_hdr.bin" || true
          wget -O files/lib/firmware/mediatek/mt7927/WIFI_RAM_CODE_MT6639_2_1.bin "https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7927/WIFI_RAM_CODE_MT6639_2_1.bin" || true

          # Update & Install Feeds Global
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Custom DNA (First-Boot Installer, Repo Key Register & Menu Customization)
        run: |
          cd openwrt
          mkdir -p files/etc/uci-defaults
          cat <<EOF > files/etc/uci-defaults/99-lemwrt-final
          #!/bin/sh
          # 1. Identitas Router
          uci set system.@system[0].hostname='${{ github.event.inputs.set_hostname }}'
          (echo 'mi1003'; echo 'mi1003') | passwd root

          # 1a. Registrasi REPO KEY 4IceG ke OPKG System
          if [ -f /etc/opkg/keys/IceG-repo.pub ]; then
            opkg-key add /etc/opkg/keys/IceG-repo.pub 2>/dev/null || true
          fi

          # 1b. Auto-install paket Pre-built APK offline dari lokal /ipk
          if [ -d /ipk ]; then
            for pkg in /ipk/*.apk /ipk/*.ipk; do
              [ -f "\$pkg" ] && apk add --allow-untrusted "\$pkg" 2>/dev/null || opkg install "\$pkg" 2>/dev/null
            done
            rm -rf /ipk
          fi

          # 2. Universal Bridge LAN
          uci delete network.lan
          uci set network.lan=interface
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='${{ github.event.inputs.set_lan_ip }}'
          uci set network.lan.netmask='255.255.255.0'
          uci set network.device_lan=device
          uci set network.device_lan.name='br-lan'
          uci set network.device_lan.type='bridge'
          for i in \$(ls /sys/class/net | grep -E 'eth|enp|ena'); do
            uci add_list network.device_lan.ports="\$i"
          done

          # 2a. USB Tethering
          uci set network.wan_usb=interface
          uci set network.wan_usb.proto='dhcp'
          uci set network.wan_usb.device='usb0'
          uci set network.wan_usb.metric='20'
          uci set network.device_usb=device
          uci set network.device_usb.name='usb0'
          uci commit network

          # 3. WiFi Setup
          uci set wireless.radio0.disabled='0'
          uci set wireless.radio0.band='5g'
          uci set wireless.radio0.channel='149'
          uci set wireless.radio0.htmode='HE80'
          uci set wireless.radio0.country='US'
          uci set wireless.default_radio0.disabled='0'
          uci set wireless.default_radio0.ssid='${{ github.event.inputs.set_ssid }}'
          uci set wireless.default_radio0.key='mi123456'
          uci set wireless.default_radio0.encryption='sae-mixed'
          uci set wireless.default_radio0.network='lan'

          # 4. Statistik
          uci set luci_statistics.collectd_interface.enable='1'
          uci set luci_statistics.collectd_interface.Interfaces='br-lan usb0'
          uci set luci_statistics.collectd_interface.IgnoreSelected='0'
          uci set nlbwmon.@nlbwmon[0].refresh_interval='2'
          uci set nlbwmon.@nlbwmon[0].top_count='10'
          uci set nlbwmon.@nlbwmon[0].show_interface='1'
          uci set nlbwmon.@nlbwmon[0].show_mac='0'
          uci set nlbwmon.@nlbwmon[0].show_hostname='1'
          uci set nlbwmon.@nlbwmon[0].show_graph='1'
          uci set nlbwmon.@nlbwmon[0].graph_type='0'
          uci set nlbwmon.@nlbwmon[0].history_size='1440'
          
          # 5. Set Default Theme ke QuickStart / Kwrt UI
          if [ -d /usr/share/luci/menu.d/luci-app-quickstart.json ]; then
            uci set luci.main.mediaurlbase='/luci-static/quickstart' 2>/dev/null || true
          fi
          uci commit luci

          # 5a. Argon Theme Configuration
          uci set argon.@global[0].login_footer='LemWRT: High Performance Network'
          uci set argon.@global[0].bing_background='1'
          uci set argon.@global[0].theme_compatibility_mode='1'
          uci set argon.@global[0].darkmode='1'
          uci set argon.@global[0].rounded_corners='1'
          uci set argon.@global[0].custom_color_enable='1'
          uci set argon.@global[0].custom_color_primary='#1abc9c'
          uci set argon.@global[0].custom_color_accent='#e74c3c'

          # Optimasi ModemManager
          uci set modemmanager.@modemmanager[0].loglevel='ERR'
          uci set modemmanager.@modemmanager[0].enable_at_locking='0'

          # 6. RE-GROUPING MENU
          [ -f /usr/share/luci/menu.d/luci-app-statistics.json ] && sed -i 's/"admin\/statistics"/"admin\/statistics_root"/g' /usr/share/luci/menu.d/luci-app-statistics.json
          [ -f /usr/share/luci/menu.d/luci-app-nlbwmon.json ] && sed -i 's/"admin\/bandwidth"/"admin\/statistics_root"/g' /usr/share/luci/menu.d/luci-app-nlbwmon.json
          [ -f /usr/share/luci/menu.d/luci-app-mwan3.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-mwan3.json
          [ -f /usr/share/luci/menu.d/ModemManager.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/ModemManager.json
          [ -f /usr/share/luci/menu.d/luci-app-atinout.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-atinout.json
          [ -f /usr/share/luci/menu.d/luci-app-sms-manager.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-sms-manager.json
          [ -f /usr/share/luci/menu.d/luci-app-modemband.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-modemband.json
          [ -f /usr/share/luci/menu.d/luci-app-modemdata.json ] && sed -i 's/"admin\/network"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-modemdata.json
          [ -f /usr/share/luci/menu.d/luci-app-internet-detector.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-internet-detector.json
          [ -f /usr/share/luci/menu.d/luci-app-5gmodem.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-5gmodem.json
          [ -f /usr/share/luci/menu.d/luci-app-imei-changer.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-imei-changer.json
          [ -f /usr/share/luci/menu.d/luci-app-bandix-plus.json ] && sed -i 's/"admin\/services"/"admin\/modem"/g' /usr/share/luci/menu.d/luci-app-bandix-plus.json
          [ -f /usr/share/luci/menu.d/luci-app-adguardhome.json ] && sed -i 's/"admin\/services"/"admin\/dns"/g' /usr/share/luci/menu.d/luci-app-adguardhome.json
          [ -f /usr/share/luci/menu.d/luci-app-openvpn.json ] && sed -i 's/"admin\/services"/"admin\/vpn"/g' /usr/share/luci/menu.d/luci-app-openvpn.json
          [ -f /usr/share/luci/menu.d/luci-app-wireguard.json ] && sed -i 's/"admin\/network"/"admin\/vpn"/g' /usr/share/luci/menu.d/luci-app-wireguard.json
          [ -f /usr/share/luci/menu.d/luci-base.json ] && sed -i 's/"admin\/network\/wireless"/"admin\/wifi"/g' /usr/share/luci/menu.d/luci-base.json
          [ -f /usr/share/luci/menu.d/luci-app-samba4.json ] && sed -i 's/"admin\/services"/"admin\/nas"/g' /usr/share/luci/menu.d/luci-app-samba4.json
          [ -f /usr/share/luci/menu.d/luci-app-filebrowser.json ] && sed -i 's/"admin\/services"/"admin\/nas"/g' /usr/share/luci/menu.d/luci-app-filebrowser.json
          [ -f /usr/share/luci/menu.d/luci-app-tinyfilemanager.json ] && sed -i 's/"admin\/services"/"admin\/nas"/g' /usr/share/luci/menu.d/luci-app-tinyfilemanager.json
          uci commit
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-lemwrt-final

      - name: Load Configuration
        run: |
          cd openwrt
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "CONFIG_TARGET_x86_64_generic=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=64" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=2048" >> .config

          # LuCI Base
          echo "CONFIG_TARGET_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl-openssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_ttyd=y" >> .config

          # Core System & Filesystem
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nls-base=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nls-utf8=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config
          echo "CONFIG_PACKAGE_f2fs-tools=y" >> .config
          echo "CONFIG_PACKAGE_e2fsprogs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-f2fs=y" >> .config
          echo "CONFIG_PACKAGE_smartmontools=y" >> .config
          echo "CONFIG_PACKAGE_smartd=y" >> .config
          echo "CONFIG_PACKAGE_mdadm=y" >> .config
          echo "CONFIG_PACKAGE_pciutils=y" >> .config
          echo "CONFIG_PACKAGE_usbutils=y" >> .config
          echo "CONFIG_PACKAGE_nano=y" >> .config

          # Networking & Firewalls
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_firewall=y" >> .config
          echo "CONFIG_PACKAGE_iptables=y" >> .config
          echo "CONFIG_PACKAGE_wget-ssl=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config

          # Wireless & Drivers
          echo "CONFIG_PACKAGE_kmod-mt7921e=y" >> .config
          echo "CONFIG_PACKAGE_mt7921bt-firmware=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7921s=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7921u=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7921-common=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7921-firmware=y" >> .config
          echo "CONFIG_PACKAGE_wpad-openssl=y" >> .config
          echo "CONFIG_PACKAGE_kmod-iwlwifi=y" >> .config
          echo "CONFIG_PACKAGE_iwlwifi-firmware-ax200=y" >> .config

          # Docker Ecosystem Native Compilation
          echo "CONFIG_PACKAGE_dockerd=y" >> .config
          echo "CONFIG_PACKAGE_docker=y" >> .config
          echo "CONFIG_PACKAGE_docker-compose=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          echo "CONFIG_PACKAGE_kmod-veth=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-ipvs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-btrfs=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-overlayfs=y" >> .config

          # Web App & Manager Tools
          echo "CONFIG_PACKAGE_luci-app-tinyfilemanager=y" >> .config
          echo "CONFIG_PACKAGE_php8=y" >> .config
          echo "CONFIG_PACKAGE_php8-cgi=y" >> .config
          echo "CONFIG_PACKAGE_uhttpd=y" >> .config

          # Kwrt UI / QuickStart Dashboard Ecosystem (AKTIF)
          echo "CONFIG_PACKAGE_quickstart=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config
          echo "CONFIG_PACKAGE_istore=y" >> .config
          echo "CONFIG_PACKAGE_istore-ui=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-kiddin9=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config

          # Applications Suite
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-filebrowser=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mini-diskmanager=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adguardhome=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-atinout=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-adblock-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-statistics=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openvpn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-wireguard=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-arwi-dashboard=y" >> .config
          echo "CONFIG_PACKAGE_openwrt-bandix-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-bandix-plus=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-5gmodem=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-imei-changer=y" >> .config
          echo "CONFIG_PACKAGE_sms-tool=y" >> .config
          echo "CONFIG_PACKAGE_atinout=y" >> .config

          # PCIe & USB Network Drivers
          echo "CONFIG_PACKAGE_kmod-ixgbe=y" >> .config
          echo "CONFIG_PACKAGE_kmod-e1000e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-igb=y" >> .config
          echo "CONFIG_PACKAGE_kmod-igc=y" >> .config
          echo "CONFIG_PACKAGE_kmod-r8169=y" >> .config
          echo "CONFIG_PACKAGE_kmod-r8125=y" >> .config
          echo "CONFIG_PACKAGE_kmod-r8126=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-rtl8152=y" >> .config

          # Modem Drivers
          echo "CONFIG_PACKAGE_kmod-mhi-bus=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mhi-pci-generic=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mhi-net=y" >> .config
          echo "CONFIG_PACKAGE_kmod-wwan=y" >> .config
          echo "CONFIG_PACKAGE_usb-modeswitch=y" >> .config
          echo "CONFIG_PACKAGE_modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y" >> .config
          
          make defconfig

      - name: Build Firmware
        run: |
          cd openwrt
          # Perintah resmi OpenWrt (-k) agar build terus berjalan hingga selesai
          make -j$(nproc) -k || make -j1 V=s -k

      - name: Set Build Date
        id: date
        run: echo "date=$(date +'%d%m%Y')" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemWRT-UltraPro_${{ steps.date.outputs.date }}
          path: openwrt/bin/targets/x86/64/*.img.gz
